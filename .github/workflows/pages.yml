name: CA OS V0.1 — Build & tests
on:
  push:
    branches: [main, ca-os-v0.1-final]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ca-os-v0.1-dist
          path: dist
          if-no-files-found: error
