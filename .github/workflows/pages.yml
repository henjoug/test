name: CA OS Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ca-os-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore exact corrected source bundle
        run: |
          mkdir -p corrected
          base64 -d artifacts/CA-OS-V0.1-source-corrected.tar.gz.b64 > /tmp/ca-os-v0.1.tar.gz
          tar -xzf /tmp/ca-os-v0.1.tar.gz -C corrected
      - name: Install dependencies
        working-directory: corrected
        run: npm install
      - name: Run core tests
        working-directory: corrected
        run: npm run test:core
      - name: Build production
        working-directory: corrected
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ca-os-v0.1-corrected-dist
          path: ./corrected/dist
          if-no-files-found: error
